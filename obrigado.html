<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mensagem recebida | EXPLORE</title>
<meta name="description" content="Recebemos sua mensagem. A EXPLORE responde em até 1 dia útil.">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#612B4A">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-192.png">

<style>
  :root{
    --bordeaux: #612B4A;
    --bordeaux-escuro: #431E33;
    --brass: #B8863E;
    --paper: #FBF9F6;
    --ink: #221A1E;
    --ink-soft: #5B4F55;
    --line: #A68C6A;
  }
  *{ box-sizing: border-box; margin:0; padding:0; }
  body{
    font-family: Calibri, "Segoe UI", Arial, sans-serif;
    color: var(--ink);
    background: var(--paper);
    line-height: 1.55;
    min-height: 100vh;
    display:flex; align-items:center; justify-content:center;
    padding: 24px;
  }
  .caixa{ max-width: 480px; text-align:center; }
  .logo{ height: 46px; margin: 0 auto 40px; }
  .icone{
    width:64px; height:64px; border-radius:50%; background: var(--paper-alt, #F3EEE8);
    display:flex; align-items:center; justify-content:center; margin: 0 auto 26px;
  }
  .icone svg{ width:30px; height:30px; }
  h1{ font-family: Georgia, "Times New Roman", serif; font-size: 28px; color: var(--bordeaux-escuro); margin-bottom: 14px; }
  p{ color: var(--ink-soft); font-size: 16px; margin-bottom: 30px; }
  .btn{
    display:inline-block; padding: 13px 26px; border-radius: 4px;
    background: var(--bordeaux); color:#fff; text-decoration:none;
    font-weight:600; font-size:15px;
  }
  .btn:hover{ background: var(--bordeaux-escuro); }
  .btn:focus-visible, a:focus-visible{ outline: 2px solid var(--brass); outline-offset: 3px; }
</style>
</head>
<body>
  <div class="caixa">
    <img src="assets/logo-bordeaux.png" alt="EXPLORE" class="logo">
    <div class="icone">
      <svg viewBox="0 0 24 24" fill="none" stroke="#612B4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 6L9 17l-5-5"/>
      </svg>
    </div>
    <h1>Recebemos sua mensagem</h1>
    <p>Obrigado por entrar em contato com a EXPLORE. Respondemos em até 1 dia útil, geralmente pelo e-mail que você informou.</p>
    <a href="index.html" class="btn">Voltar para o site</a>
  </div>
</body>
</html>
