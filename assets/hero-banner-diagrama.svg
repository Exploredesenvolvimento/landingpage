<svg viewBox="0 0 1600 666" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#431E33"/>
      <stop offset="55%" stop-color="#612B4A"/>
      <stop offset="100%" stop-color="#8A5F26"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="666" fill="url(#bg)"/>

  <!-- blueprint grid -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="111" x2="1600" y2="111"/>
    <line x1="0" y1="222" x2="1600" y2="222"/>
    <line x1="0" y1="333" x2="1600" y2="333"/>
    <line x1="0" y1="444" x2="1600" y2="444"/>
    <line x1="0" y1="555" x2="1600" y2="555"/>
    <line x1="200" y1="0" x2="200" y2="666"/>
    <line x1="400" y1="0" x2="400" y2="666"/>
    <line x1="600" y1="0" x2="600" y2="666"/>
    <line x1="800" y1="0" x2="800" y2="666"/>
    <line x1="1000" y1="0" x2="1000" y2="666"/>
    <line x1="1200" y1="0" x2="1200" y2="666"/>
    <line x1="1400" y1="0" x2="1400" y2="666"/>
  </g>

  <!-- compass rose watermark -->
  <g transform="translate(1370,120)" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1" fill="none">
    <circle cx="0" cy="0" r="190"/>
    <circle cx="0" cy="0" r="142"/>
    <line x1="0" y1="-190" x2="0" y2="190"/>
    <line x1="-190" y1="0" x2="190" y2="0"/>
    <line x1="-134" y1="-134" x2="134" y2="134"/>
    <line x1="134" y1="-134" x2="-134" y2="134"/>
  </g>

  <!-- LEFT: scattered/disorganized nodes -->
  <g font-family="Calibri, Arial, sans-serif" font-size="12.5" fill="#E3B975" fill-opacity="0.85" letter-spacing="1.5">
    <text x="120" y="150">HOJE</text>
  </g>
  <g stroke="#F4E8DC" stroke-opacity="0.22" stroke-width="1.3">
    <line x1="150" y1="230" x2="260" y2="310"/>
    <line x1="150" y1="230" x2="120" y2="380"/>
    <line x1="260" y1="310" x2="200" y2="450"/>
    <line x1="120" y1="380" x2="200" y2="450"/>
    <line x1="260" y1="310" x2="360" y2="270"/>
    <line x1="360" y1="270" x2="330" y2="420"/>
    <line x1="200" y1="450" x2="330" y2="420"/>
  </g>
  <g fill="#F4E8DC" fill-opacity="0.65">
    <circle cx="150" cy="230" r="7"/>
    <circle cx="260" cy="310" r="7"/>
    <circle cx="120" cy="380" r="7"/>
    <circle cx="200" cy="450" r="7"/>
    <circle cx="360" cy="270" r="7"/>
    <circle cx="330" cy="420" r="7"/>
  </g>
  <g font-family="Calibri, Arial, sans-serif" font-size="12.5" fill="#E8D9DE" fill-opacity="0.7">
    <text x="70" y="500">Decisões e processos sem</text>
    <text x="70" y="520">estrutura clara</text>
  </g>

  <!-- arrow from left to right -->
  <g stroke="#E3B975" stroke-width="2" fill="none" stroke-dasharray="1 8" stroke-linecap="round">
    <path d="M 430 340 C 520 340, 560 333, 650 333"/>
  </g>
  <polygon points="650,326 668,333 650,340" fill="#E3B975"/>

  <!-- RIGHT: structured 5-pillar hub -->
  <g font-family="Calibri, Arial, sans-serif" font-size="12.5" fill="#E3B975" fill-opacity="0.95" letter-spacing="1.5">
    <text x="740" y="150">ESTRUTURADA</text>
  </g>

  <g stroke="#E3B975" stroke-opacity="0.55" stroke-width="1.4">
    <line x1="1000" y1="333" x2="1000" y2="200"/>
    <line x1="1000" y1="333" x2="1135" y2="255"/>
    <line x1="1000" y1="333" x2="1135" y2="415"/>
    <line x1="1000" y1="333" x2="1000" y2="470"/>
    <line x1="1000" y1="333" x2="865" y2="415"/>
  </g>

  <circle cx="1000" cy="333" r="15" fill="#E3B975"/>

  <g fill="#ffffff">
    <circle cx="1000" cy="200" r="9"/>
    <circle cx="1135" cy="255" r="9"/>
    <circle cx="1135" cy="415" r="9"/>
    <circle cx="1000" cy="470" r="9"/>
    <circle cx="865" cy="415" r="9"/>
  </g>

  <g font-family="Calibri, Arial, sans-serif" font-size="13" fill="#F4E8DC" text-anchor="middle">
    <text x="1000" y="182">Estratégia</text>
    <text x="1200" y="252">Pessoas</text>
    <text x="1200" y="418">Operações</text>
    <text x="1000" y="500">Financeiro</text>
    <text x="800" y="418">Governança</text>
  </g>
</svg>
