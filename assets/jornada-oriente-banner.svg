<svg viewBox="0 0 1200 462" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#431E33"/>
      <stop offset="55%" stop-color="#612B4A"/>
      <stop offset="100%" stop-color="#8A5F26"/>
    </linearGradient>
    <linearGradient id="barFade" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#F4E8DC" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#F4E8DC" stop-opacity="0.10"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="462" fill="url(#bg)"/>

  <!-- blueprint grid, very subtle -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="77" x2="1200" y2="77"/>
    <line x1="0" y1="154" x2="1200" y2="154"/>
    <line x1="0" y1="231" x2="1200" y2="231"/>
    <line x1="0" y1="308" x2="1200" y2="308"/>
    <line x1="0" y1="385" x2="1200" y2="385"/>
    <line x1="150" y1="0" x2="150" y2="462"/>
    <line x1="300" y1="0" x2="300" y2="462"/>
    <line x1="450" y1="0" x2="450" y2="462"/>
    <line x1="600" y1="0" x2="600" y2="462"/>
    <line x1="750" y1="0" x2="750" y2="462"/>
    <line x1="900" y1="0" x2="900" y2="462"/>
    <line x1="1050" y1="0" x2="1050" y2="462"/>
  </g>

  <!-- compass rose watermark, top-right -->
  <g transform="translate(1015,80)" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1" fill="none">
    <circle cx="0" cy="0" r="150"/>
    <circle cx="0" cy="0" r="112"/>
    <line x1="0" y1="-150" x2="0" y2="150"/>
    <line x1="-150" y1="0" x2="150" y2="0"/>
    <line x1="-106" y1="-106" x2="106" y2="106"/>
    <line x1="106" y1="-106" x2="-106" y2="106"/>
  </g>

  <!-- baseline for the 5 pillars -->
  <line x1="140" y1="420" x2="526" y2="420" stroke="#F4E8DC" stroke-opacity="0.3" stroke-width="1"/>

  <!-- 5 pillars: Estrategia, Pessoas, Operacoes, Financeiro, Governanca -->
  <g>
    <rect x="150" y="322" width="46" height="98" rx="3" fill="url(#barFade)" stroke="#F4E8DC" stroke-opacity="0.4"/>
    <rect x="230" y="288" width="46" height="132" rx="3" fill="url(#barFade)" stroke="#F4E8DC" stroke-opacity="0.4"/>
    <rect x="310" y="246" width="46" height="174" rx="3" fill="url(#barFade)" stroke="#F4E8DC" stroke-opacity="0.4"/>
    <rect x="390" y="270" width="46" height="150" rx="3" fill="url(#barFade)" stroke="#F4E8DC" stroke-opacity="0.4"/>
    <rect x="470" y="212" width="46" height="208" rx="3" fill="url(#barFade)" stroke="#F4E8DC" stroke-opacity="0.4"/>
  </g>
  <g font-family="Calibri, Arial, sans-serif" font-size="12.5" fill="#F4E8DC" fill-opacity="0.65" text-anchor="middle" letter-spacing="0.3">
    <text x="173" y="440">Estratégia</text>
    <text x="253" y="440">Pessoas</text>
    <text x="333" y="440">Operações</text>
    <text x="413" y="440">Financeiro</text>
    <text x="493" y="440">Governança</text>
  </g>
  <g font-family="Calibri, Arial, sans-serif" font-size="11" fill="#E3B975" fill-opacity="0.8" text-anchor="middle" letter-spacing="1.5">
    <text x="333" y="65">OS 5 PILARES DO DIAGNÓSTICO</text>
  </g>

  <!-- ascending path across the 3 phases -->
  <path d="M 620 360 C 700 360, 700 280, 780 280 C 860 280, 860 165, 940 165" fill="none" stroke="#E3B975" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="1 9"/>

  <g>
    <circle cx="620" cy="360" r="9" fill="#E3B975"/>
    <circle cx="780" cy="280" r="9" fill="#E3B975"/>
    <circle cx="940" cy="165" r="9" fill="#E3B975"/>
  </g>

  <g font-family="Georgia, 'Times New Roman', serif" font-size="16.5" font-weight="700" fill="#ffffff">
    <text x="620" y="335" text-anchor="middle">01</text>
    <text x="780" y="255" text-anchor="middle">02</text>
    <text x="940" y="140" text-anchor="middle">03</text>
  </g>
  <g font-family="Calibri, Arial, sans-serif" font-size="13" fill="#F4E8DC" fill-opacity="0.9" text-anchor="middle">
    <text x="620" y="395">Diagnóstico</text>
    <text x="780" y="315">Mapa de Orientação</text>
    <text x="940" y="200">Trilha de Desenvolvimento</text>
  </g>
</svg>
