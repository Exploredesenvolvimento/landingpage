<svg viewBox="0 0 1200 462" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#431E33"/>
      <stop offset="55%" stop-color="#612B4A"/>
      <stop offset="100%" stop-color="#8A5F26"/>
    </linearGradient>
    <linearGradient id="cellLow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4E8DC" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#F4E8DC" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="462" fill="url(#bg)"/>

  <!-- blueprint grid, very subtle -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="77" x2="1200" y2="77"/>
    <line x1="0" y1="154" x2="1200" y2="154"/>
    <line x1="0" y1="231" x2="1200" y2="231"/>
    <line x1="0" y1="308" x2="1200" y2="308"/>
    <line x1="0" y1="385" x2="1200" y2="385"/>
    <line x1="150" y1="0" x2="150" y2="462"/>
    <line x1="300" y1="0" x2="300" y2="462"/>
    <line x1="450" y1="0" x2="450" y2="462"/>
    <line x1="600" y1="0" x2="600" y2="462"/>
    <line x1="750" y1="0" x2="750" y2="462"/>
    <line x1="900" y1="0" x2="900" y2="462"/>
    <line x1="1050" y1="0" x2="1050" y2="462"/>
  </g>

  <!-- compass rose watermark, top-right -->
  <g transform="translate(1015,80)" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1" fill="none">
    <circle cx="0" cy="0" r="150"/>
    <circle cx="0" cy="0" r="112"/>
    <line x1="0" y1="-150" x2="0" y2="150"/>
    <line x1="-150" y1="0" x2="150" y2="0"/>
    <line x1="-106" y1="-106" x2="106" y2="106"/>
    <line x1="106" y1="-106" x2="-106" y2="106"/>
  </g>

  <g font-family="Calibri, Arial, sans-serif" font-size="11" fill="#E3B975" fill-opacity="0.8" text-anchor="start" letter-spacing="1.5">
    <text x="150" y="65">MATRIZ DE RISCOS PSICOSSOCIAIS</text>
  </g>

  <!-- risk matrix: 4x4 grid, probability (x) vs impact (y) -->
  <g transform="translate(150,110)">
    <!-- background cells with risk-zone tint -->
    <!-- row 1 (top = alto impacto) -->
    <rect x="0"   y="0"   width="85" height="70" fill="#E3B975" fill-opacity="0.10"/>
    <rect x="87"  y="0"   width="85" height="70" fill="#E3B975" fill-opacity="0.18"/>
    <rect x="174" y="0"   width="85" height="70" fill="#c96a4e" fill-opacity="0.28"/>
    <rect x="261" y="0"   width="85" height="70" fill="#c96a4e" fill-opacity="0.42"/>
    <!-- row 2 -->
    <rect x="0"   y="72"  width="85" height="70" fill="#E3B975" fill-opacity="0.06"/>
    <rect x="87"  y="72"  width="85" height="70" fill="#E3B975" fill-opacity="0.10"/>
    <rect x="174" y="72"  width="85" height="70" fill="#E3B975" fill-opacity="0.18"/>
    <rect x="261" y="72"  width="85" height="70" fill="#c96a4e" fill-opacity="0.28"/>
    <!-- row 3 -->
    <rect x="0"   y="144" width="85" height="70" fill="#F4E8DC" fill-opacity="0.04"/>
    <rect x="87"  y="144" width="85" height="70" fill="#E3B975" fill-opacity="0.06"/>
    <rect x="174" y="144" width="85" height="70" fill="#E3B975" fill-opacity="0.10"/>
    <rect x="261" y="144" width="85" height="70" fill="#E3B975" fill-opacity="0.18"/>
    <!-- row 4 (bottom = baixo impacto) -->
    <rect x="0"   y="216" width="85" height="70" fill="#F4E8DC" fill-opacity="0.03"/>
    <rect x="87"  y="216" width="85" height="70" fill="#F4E8DC" fill-opacity="0.04"/>
    <rect x="174" y="216" width="85" height="70" fill="#E3B975" fill-opacity="0.06"/>
    <rect x="261" y="216" width="85" height="70" fill="#E3B975" fill-opacity="0.10"/>

    <!-- grid lines -->
    <g stroke="#F4E8DC" stroke-opacity="0.3" stroke-width="1" fill="none">
      <rect x="0" y="0" width="346" height="286"/>
      <line x1="85" y1="0" x2="85" y2="286"/>
      <line x1="172" y1="0" x2="172" y2="286"/>
      <line x1="259" y1="0" x2="259" y2="286"/>
      <line x1="0" y1="70" x2="346" y2="70"/>
      <line x1="0" y1="142" x2="346" y2="142"/>
      <line x1="0" y1="214" x2="346" y2="214"/>
    </g>

    <!-- axis labels -->
    <g font-family="Calibri, Arial, sans-serif" font-size="11.5" fill="#F4E8DC" fill-opacity="0.7">
      <text x="173" y="308" text-anchor="middle">PROBABILIDADE</text>
      <text x="-14" y="150" text-anchor="middle" transform="rotate(-90 -14 150)">IMPACTO</text>
    </g>

    <!-- plotted risk points -->
    <circle cx="40" cy="250" r="6" fill="#F4E8DC" fill-opacity="0.7"/>
    <circle cx="120" cy="190" r="6" fill="#F4E8DC" fill-opacity="0.7"/>
    <circle cx="215" cy="105" r="7" fill="#ffffff"/>
    <circle cx="300" cy="45" r="7" fill="#ffffff"/>
    <circle cx="160" cy="55" r="6" fill="#F4E8DC" fill-opacity="0.7"/>
  </g>

  <!-- right side: from mapping to PGR -->
  <g transform="translate(600,0)">
    <g font-family="Calibri, Arial, sans-serif" font-size="11" fill="#E3B975" fill-opacity="0.8" text-anchor="start" letter-spacing="1.5">
      <text x="0" y="65">DO MAPEAMENTO AO PGR DOCUMENTADO</text>
    </g>

    <g font-family="Calibri, Arial, sans-serif" font-size="14" fill="#F4E8DC">
      <g transform="translate(0,120)">
        <circle cx="9" cy="-4" r="3.5" fill="#E3B975"/>
        <text x="24" y="0">Mapeamento de riscos por função e setor</text>
      </g>
      <g transform="translate(0,168)">
        <circle cx="9" cy="-4" r="3.5" fill="#E3B975"/>
        <text x="24" y="0">PGR (Programa de Gerenciamento de Riscos)</text>
      </g>
      <g transform="translate(0,216)">
        <circle cx="9" cy="-4" r="3.5" fill="#E3B975"/>
        <text x="24" y="0">Plano de ação com prazos e responsáveis</text>
      </g>
      <g transform="translate(0,264)">
        <circle cx="9" cy="-4" r="3.5" fill="#E3B975"/>
        <text x="24" y="0">Capacitação de lideranças</text>
      </g>
    </g>

    <line x1="2" y1="100" x2="2" y2="270" stroke="#E3B975" stroke-opacity="0.4" stroke-width="1.5"/>
  </g>
</svg>
