<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página não encontrada | EXPLORE</title>
<meta name="description" content="Essa página não existe ou foi movida. Volte para o site da EXPLORE Desenvolvimento de Gente e Gestão.">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#612B4A">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-192.png">

<style>
  :root{
    --bordeaux: #612B4A;
    --bordeaux-escuro: #431E33;
    --brass: #B8863E;
    --brass-text: #8A5F26;
    --paper: #FBF9F6;
    --ink: #221A1E;
    --ink-soft: #5B4F55;
  }
  *{ box-sizing: border-box; margin:0; padding:0; }
  body{
    font-family: Calibri, "Segoe UI", Arial, sans-serif;
    color: var(--ink);
    background: var(--paper);
    line-height: 1.55;
    min-height: 100vh;
    display:flex; align-items:center; justify-content:center;
    padding: 24px;
  }
  .caixa{ max-width: 480px; text-align:center; }
  .logo{ height: 34px; margin: 0 auto 40px; }
  .codigo{ font-family: Georgia, serif; font-size: 64px; color: var(--brass-text); margin-bottom: 10px; }
  h1{ font-family: Georgia, "Times New Roman", serif; font-size: 26px; color: var(--bordeaux-escuro); margin-bottom: 14px; }
  p{ color: var(--ink-soft); font-size: 16px; margin-bottom: 30px; }
  .btn{
    display:inline-block; padding: 13px 26px; border-radius: 4px;
    background: var(--bordeaux); color:#fff; text-decoration:none;
    font-weight:600; font-size:15px;
  }
  .btn:hover{ background: var(--bordeaux-escuro); }
  .btn:focus-visible{ outline: 2px solid var(--brass); outline-offset: 3px; }
</style>
</head>
<body>
  <div class="caixa">
    <img src="assets/logo-bordeaux.png" alt="EXPLORE" class="logo">
    <div class="codigo">404</div>
    <h1>Essa página não existe (ainda)</h1>
    <p>O link pode ter mudado de endereço ou foi digitado errado. Volta pro início que a gente te ajuda a encontrar o que precisa.</p>
    <a href="index.html" class="btn">Voltar para o site</a>
  </div>
</body>
</html>
